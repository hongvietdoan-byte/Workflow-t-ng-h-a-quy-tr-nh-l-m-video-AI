[theme]
base = "light"
primaryColor = "#2F5BEA"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
borderColor = "#7C879A"
showWidgetBorder = true
font = "sans serif"

[server]
headless = true
enableStaticServing = true      # dashboard/static/fonts/* (font Inter đi kèm) phục vụ ở /app/static/fonts/…

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
